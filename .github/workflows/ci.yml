name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', '1.26.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Build and test nested modules
        run: |
          # Nested modules (examples and the gRPC bridge) are outside ./..., so
          # build and test them explicitly or they rot unnoticed.
          find example bridge -name go.mod -print0 | while IFS= read -r -d '' mod; do
            dir=$(dirname "$mod")
            echo "::group::$dir"
            (cd "$dir" && go vet ./... && go test ./... && { go build -o "$(mktemp -d)/" ./... 2>/dev/null || go build ./...; })
            echo "::endgroup::"
          done

      # -coverpkg attributes coverage to the packages under test rather than to
      # the package holding the test, so the end-to-end suite counts towards the
      # library it exercises instead of reading as zero.
      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: matrix.go == '1.25.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The module targets go 1.25.0 (google.golang.org/grpc requires it), which
      # the v1 line of golangci-lint cannot analyze, so both the toolchain and
      # the linter are on versions that understand it.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      # Invoked directly rather than through dominikh/staticcheck-action: that
      # action pins an actions/cache release built on the deprecated Node 20
      # runtime, which cannot be overridden from here.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

  tidy:
    name: Modules tidy & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: go mod verify
        run: go mod verify

      - name: go mod tidy is clean
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: Fuzz JSON formatter (30s)
        run: go test -run '^$' -fuzz '^FuzzJSONFormatterFormat$' -fuzztime=30s .
